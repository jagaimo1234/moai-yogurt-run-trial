<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Moai Robo — Yogurt Run EX (Trial Edition)</title>
<style>
:root{--bg:#0b1020;--fg:#e6f0ff;--ui:#111827}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
#wrap{display:flex;flex-direction:column;height:100%}
#game{flex:1 1 auto;display:flex;align-items:center;justify-content:center;position:relative;}
canvas{width:100vw;height:100vh;image-rendering:pixelated;touch-action:none;background:#000}
#hud{position:fixed;top:8px;left:8px;background:#0008;padding:4px 8px;border-radius:8px;font:12px monospace;z-index:3}
#ctrls{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;gap:12px;z-index:2}
.btn{flex:1;background:var(--ui);color:var(--fg);border:1px solid #374151;border-radius:14px;padding:10px 8px;text-align:center;font-weight:700;user-select:none}
.btn:active{background:#374151;}
/* ★スタート・オーバー画面の調整 */
#start,#over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0b1020;z-index:4}
#over{display:none}
#title{font:24px/1.2 monospace;letter-spacing:.5px;opacity:.95;text-align:center;margin-bottom:4px;color:#ffcc00;} /* ★色を強調 */
#edition{font:14px/1.2 monospace;color:#ff9900;margin-bottom:10px;} /* ★体験版表記 */
.small{font:12px monospace;opacity:.8;text-align:center}
#overTitle{font:20px monospace;margin-bottom:4px}
#mute{position:fixed;top:8px;right:8px;z-index:3;
  background:#111827;color:#e6f0ff;border:1px solid #374151;
  border-radius:12px;padding:6px 10px;font:12px/1 system-ui,monospace}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv" width="360" height="200"></canvas>
  </div>

  <div id="hud">
    S:<span id="sc">0</span>
    &nbsp;L:<span id="lf">3</span>
    &nbsp;ST:<span id="st">1</span>
    &nbsp;T:<span id="tg">200</span>
  </div>

  <button id="mute" aria-pressed="false" title="Sound">🔇 音OFF</button>

  <div id="ctrls">
    <div class="btn" id="jump">JUMP</div>
    <div class="btn" id="shot">SHOT</div>
    <div class="btn" id="drop">DROP</div>
  </div>

  <div id="start">
    <div style="font-size:40px;margin-bottom:10px;">🗿</div>
    <div id="title">MOAI ROBO — YOGURT RUN</div>
    <div id="edition">EX TRIAL EDITION</div>
    <div class="small">
      Tap/Space/↑: Jump | ↓: Drop<br>F/SHOT: Attack (BOSS STAGE: UNLOCKED)
    </div>
    <div class="small" style="margin-top:10px; color:#ff9900;">
      🚧 1st STAGE ONLY 🚧
    </div>
    <div class="btn" id="go" style="width:140px;margin-top:10px;background:#ef4444;">GAME START</div>
  </div>

  <div id="over">
    <div id="overTitle">GAME OVER</div>
    <div id="scoreline" class="small"></div>
    <div class="btn" id="retry" style="width:120px;">RETRY</div>
  </div>
</div>

<script>
(()=>{
// ====================================
//  CONSTANTS & CONFIG
// ====================================
const G = { W:360, H:200, GROUND:200-24 };
const MAX_LIVES = 5;

// ★ステージを1stステージのみに限定 (ターゲットスコアは300)
const STAGES = [
  { id:1, name:'PLAIN', target: 300, speed:1.8, obsRate:0.9, droneRate:0.25, spikeRate:0.3, slimeRate: 0.15 }
];

// ====================================
//  CANVAS SETUP (省略)
// ====================================
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

function fitCanvas(){
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const scale = Math.floor(Math.min(innerWidth/G.W, innerHeight/G.H) * dpr);
  cv.width  = G.W * scale;
  cv.height = G.H * scale;
  cv.style.width  = (G.W * scale / dpr) + 'px';
  cv.style.height = (G.H * scale / dpr) + 'px';
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
fitCanvas();
addEventListener('resize', fitCanvas);

// ====================================
//  IMAGE LOADING (省略)
// ====================================
const moaiImage = new Image();
moaiImage.src = 'moai_robo.png';
let moaiImageLoaded = false;
moaiImage.onload = () => { moaiImageLoaded = true; };
moaiImage.onerror = () => { console.error("Error loading moai_robo.png. Check file path."); };

const authorImage = new Image();
authorImage.src = 'boss_author.png'; // ボス画像は未使用だが残す
let authorImageLoaded = false;
authorImage.onload = () => { authorImageLoaded = true; };
authorImage.onerror = () => { console.error("Error loading boss_author.png. Check file path."); };

const slimeImage = new Image();
slimeImage.src = 'enemy_slime.png';
let slimeImageLoaded = false;
slimeImage.onload = () => { slimeImageLoaded = true; };
slimeImage.onerror = () => { console.error("Error loading enemy_slime.png. Check file path."); };

const insectImage = new Image();
insectImage.src = 'enemy_insect.png'; 
let insectImageLoaded = false;
insectImage.onload = () => { insectImageLoaded = true; };
insectImage.onerror = () => { console.error("Error loading enemy_insect.png. Check file path."); };


// ====================================
//  AUDIO SYSTEM (省略)
// ====================================
let AC = null;
let audioUnlocked = false;
let muted = false;

function audioCtx(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}

['touchstart','mousedown','keydown'].forEach(ev=>{
  addEventListener(ev, async ()=>{
    try{
      const c = audioCtx();
      if(c.state === 'suspended') await c.resume();
      audioUnlocked = true;
    }catch(e){}
  }, {passive:true});
});

function beep(freq=440, dur=0.07, type='square', vol=0.18){
  if(muted) return;
  try{
    const c = audioCtx();
    const now = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, now);
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.start(now);
    o.stop(now+dur+0.05);
  }catch(e){}
}

function playFanfare(){
    if(muted) return;
    beep(784, 0.1, 'sine', 0.2);
    setTimeout(()=>beep(988, 0.15, 'sine', 0.25), 100);
    setTimeout(()=>beep(1319, 0.3, 'sine', 0.3), 300);
}

const muteBtn = document.getElementById('mute');
function updateMuteUI(){
  muteBtn.textContent = muted ? '🔇 音OFF' : '🔊 音ON';
  muteBtn.setAttribute('aria-pressed', String(!muted));
}
muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  updateMuteUI();
  if(!muted) beep(660,0.06,'square',0.2);
});
updateMuteUI();

// ====================================
//  GAME STATE (省略)
// ====================================
let state = 'START'; // START, PLAY, ENDING, OVER
let score = 0;
let best = 0;
let lives = 3;
let t = 0;

let stageIndex = 0;
let currentStage = STAGES[0];

const player = { x:80, y:G.GROUND, vy:0, onG:true, bg:0, speed:0, bob:0 };
const items = [];
const obstacles = [];
let itemSpawn = 30;
let obstacleSpawn = 60;

// Boss (未使用だが定義を残す)
const BOSS_MAX_HP = 100;
const BOSS_ATTACKS = ['BeerShot', 'Laser', 'Homing'];
const boss = { 
  active:false, x:G.W-60, y:G.GROUND-40, hp:BOSS_MAX_HP, timer:0, dir:1, 
  attackIndex:0, attackTimer:180, 
  isCharging:false, beamWidth:0
};
const bossShots = []; 
const bullets   = []; 

// Ending (体験版用に修正)
let endScrollY = 0;
const CREDITS = [
  "DEMO VERSION CLEAR!", "",
  "🎉 1 STAGE CLEAR! 🎉", "",
  "製品版をお楽しみに！！", "",
  "MOAI ROBO - YOGURT RUN EX", "",
  "Special Thanks: Kanazawa Moataro"
];

// HUD Elements (省略)
const scEl = document.getElementById('sc');
const lfEl = document.getElementById('lf');
const stEl = document.getElementById('st');
const tgEl = document.getElementById('tg');
const overEl = document.getElementById('over');
const startEl = document.getElementById('start');

// ====================================
//  DRAWING FUNCTIONS (省略)
// ====================================
function drawSky(){
  let skyHex = '#79bff0';
  if(currentStage.id===2) skyHex = '#ff9966';
  if(currentStage.id===3) skyHex = '#0f172a';
  if(currentStage.id===4) skyHex = '#e0f2fe';
  if(currentStage.id===5) skyHex = '#1a0b2e';
  
  ctx.fillStyle = skyHex;
  ctx.fillRect(0,0,G.W,G.H);

  ctx.globalAlpha = 0.1;
  ctx.fillStyle = '#fff';
  for(let y=0; y<G.H; y+=2){
    for(let x=((y>>1)&1)?1:0; x<G.W; x+=2){
      ctx.fillRect(x,y,1,1);
    }
  }
  ctx.fillStyle = '#000';
  ctx.globalAlpha = 0.05;
  for(let y=0; y<G.H; y+=4){
    ctx.fillRect(0,y,G.W,1);
  }
  ctx.globalAlpha = 1;

  if(currentStage.id===1 || currentStage.id===4){
    ctx.fillStyle = '#fff';
    const cloudSpeed = t * 0.2;
    for(let i=0; i<3; i++){
        let cx = ((i*120) - cloudSpeed) % (G.W+100);
        if(cx < -50) cx += G.W+100;
        let cy = 30 + (i*20);
        ctx.fillRect(cx, cy, 30, 8);
        ctx.fillRect(cx+8, cy-8, 14, 8);
        ctx.fillRect(cx+4, cy+8, 20, 4);
    }
  }

  if(currentStage.id===3 || currentStage.id===5){
    ctx.fillStyle = '#fff';
    for(let i=0; i<30; i++){
      let sx = ((i*67) - player.bg*0.1) % G.W;
      if(sx<0) sx+=G.W;
      let sy = (i*93)%100;
      ctx.fillRect(sx,sy,1,1);
    }
  }
}

function drawGround(){
  let g1='#2a612a', g2='#72d65c', g3='#60352f';
  if(currentStage.id===4) { g1='#3b82f6'; g2='#bfdbfe'; g3='#1e3a8a'; }
  if(currentStage.id===5) { g1='#374151'; g2='#6b7280'; g3='#111827'; }

  for(let x=0; x<G.W; x+=16){
    let dx = x - (player.bg % 16);
    ctx.fillStyle=g3; ctx.fillRect(dx,G.H-20,16,20);
    ctx.fillStyle=g1; ctx.fillRect(dx,G.H-24,16,4);
    ctx.fillStyle=g2; ctx.fillRect(dx+((x>>1)&1),G.H-23,2,2);
    
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(dx+4, G.H-12, 2, 2);
    ctx.fillRect(dx+10, G.H-6, 2, 2);
  }
}

function drawMoai(){
  if(!moaiImageLoaded) return; 

  const x=player.x;
  const y=player.y;
  const bob = Math.sin(player.bob)*1.5;
  const frameWidth = 32; 
  const frameHeight = 48; 
  
  const drawX = x - frameWidth/2; 
  const drawY = y - frameHeight + bob;

  ctx.drawImage(
    moaiImage, 
    0, 0, moaiImage.width, moaiImage.height, 
    drawX, drawY, frameWidth, frameHeight   
  );

  if(player.onG){
    ctx.fillStyle = '#fff9';
    const dustX = drawX + frameWidth/4;
    const dustY = y - 4;
    
    ctx.fillRect(dustX - 4, dustY, 4, 2);
    ctx.fillRect(dustX - 8, dustY + 2, 2, 2);
  }
}

function drawBottle(it){ // 省略
  const x=(it.x-9)|0, y=(it.y-26)|0;
  
  const labelColor = it.score === 20 ? '#ec4899' : '#60a5fa'; 
  
  ctx.fillStyle = '#3b82f6';
  ctx.fillRect(x+6, y+4, 6, 2);
  ctx.fillStyle = '#f3f4f6';
  ctx.fillRect(x+7, y+6, 4, 2);
  ctx.fillStyle = '#f3f4f6';
  ctx.fillRect(x+4, y+8, 10, 14);
  ctx.fillStyle = it.heal ? '#facc15' : labelColor;
  ctx.fillRect(x+4, y+12, 10, 4);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x+11, y+9, 1, 10);
  
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth = 1;
  ctx.strokeRect(x+4.5, y+8.5, 9, 13);
}

function drawBeer(s){ // 省略
  if(s.type !== 'BeerShot') return;
  const x=s.x, y=s.y;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(t*0.2);
  
  ctx.fillStyle='#78350f'; 
  ctx.fillRect(-4,-8,8,16);
  ctx.fillRect(-2,-12,4,4);
  ctx.fillStyle='#f59e0b';
  ctx.fillRect(-4,-2,8,6);
  
  ctx.restore();
}

function drawHomingShot(s){ // 省略
  if(s.type !== 'Homing') return;
  const x=s.x, y=s.y;
  const color = (t%10 < 5) ? '#ff5555' : '#ff0000';
  
  ctx.fillStyle = color;
  ctx.fillRect(x-4, y-4, 8, 8);
  ctx.fillStyle = '#ffcc00';
  ctx.fillRect(x-2, y-2, 4, 4);
}

function drawDroneAsInsect(d){
    if(!insectImageLoaded) return;
    
    const x=(d.x)|0, y=(d.y)|0;
    const bob = Math.sin(t*0.5)*2;
    const frameWidth = 24; 
    const frameHeight = 24; 

    const drawX = x - frameWidth/2; 
    const drawY = y - frameHeight/2 + bob; 

    // Insectの画像をDroneの描画位置に描画
    ctx.drawImage(
      insectImage, 
      0, 0, insectImage.width, insectImage.height, 
      drawX, drawY, frameWidth, frameHeight   
    );
}

function drawSlime(d){
    if(!slimeImageLoaded) return;
    
    const x=(d.x)|0, y=(d.y)|0;
    const frameWidth = 48; 
    const frameHeight = 48; 

    const drawX = x - frameWidth/2;
    const drawY = y - frameHeight; 

    ctx.drawImage(
      slimeImage,
      0, 0, slimeImage.width, slimeImage.height,
      drawX, drawY, frameWidth, frameHeight
    );
}

function drawSpike(d){
    const x=(d.x)|0, y=G.GROUND+2;
    ctx.fillStyle='#374151';
    ctx.fillRect(x-8, y-4, 16, 4);
    
    ctx.fillStyle='#ef4444';
    for(let i=0; i<3; i++){
        const sx = x - 6 + i*6;
        ctx.beginPath();
        ctx.moveTo(sx, y);
        ctx.lineTo(sx+4, y);
        ctx.lineTo(sx+2, y-8);
        ctx.fill();
    }
}

function drawMine(d){
  const x=(d.x)|0, y=(d.y)|0;
  const bob = Math.sin(t*0.5)*2;
  
  ctx.fillStyle='#dc2626';
  ctx.beginPath();
  ctx.arc(x, y+bob, 8, 0, 6.28);
  ctx.fill();
  
  ctx.fillStyle='#111827';
  ctx.fillRect(x-10, y-2+bob, 20, 4);
  ctx.fillRect(x-2, y-10+bob, 4, 20);
}

function drawBoss(){ // 未使用だが残す
  if(!boss.active || !authorImageLoaded) return;
  const x = boss.x;
  const y = boss.y + Math.sin(t*0.05)*4;

  ctx.save();
  ctx.translate(x,y);
  
  const frameWidth = 32; 
  const frameHeight = 50; 
  const drawX = -frameWidth/2;
  const drawY = -frameHeight/2; 

  ctx.drawImage(
    authorImage, 
    0, 0, authorImage.width, authorImage.height, 
    drawX, drawY, frameWidth, frameHeight   
  );

  if(boss.isCharging){
    ctx.fillStyle = (t%10<5) ? '#ff0000' : '#ffaa00';
    ctx.beginPath();
    ctx.arc(0, 0, 10 + Math.sin(t*0.5)*2, 0, 6.28);
    ctx.fill();
  }
  
  ctx.restore();

  const hpRate = Math.max(0,boss.hp)/BOSS_MAX_HP;
  const bw = 120;
  ctx.fillStyle='#000'; ctx.fillRect(G.W/2-bw/2, 8, bw, 8);
  ctx.fillStyle='#dc2626'; ctx.fillRect(G.W/2-bw/2, 8, bw*hpRate, 8);

  if(boss.beamWidth > 0){
    const beamY = boss.y; 
    const beamW = boss.beamWidth;
    ctx.fillStyle = `rgba(255, 0, 0, ${beamW/30})`;
    ctx.fillRect(boss.x-5, beamY - beamW/2, -G.W, beamW);
    
    ctx.fillStyle = 'rgba(255, 255, 0, 0.8)';
    ctx.fillRect(boss.x-5, beamY - 1, -G.W, 2);
  }
}

// ====================================
//  LOGIC
// ====================================
function initGame(){
  state = 'START';
  score = 0;
  lives = 3;
  stageIndex = 0;
  loadStage(0);
  startEl.style.display = 'flex';
  overEl.style.display = 'none';
}

function loadStage(idx){
  stageIndex = idx;
  currentStage = STAGES[stageIndex];
  items.length = 0;
  obstacles.length = 0;
  bossShots.length = 0;
  bullets.length = 0;
  
  player.x = 80;
  player.y = G.GROUND;
  player.vy = 0;
  player.speed = currentStage.speed;
  player.bg = 0;
  
  stEl.textContent = currentStage.name;
  tgEl.textContent = isFinite(currentStage.target) ? currentStage.target : '----';

  // 1stステージのみなので、ボス関連のフラグは常にOFF
  boss.active = false;
}

function startGame(){
  if(state === 'START' || state === 'OVER'){
    state = 'PLAY';
    if(lives <= 0) {
      score = 0;
      lives = 3;
      loadStage(0);
    }
    startEl.style.display = 'none';
    overEl.style.display = 'none';
    beep(660,0.1,'square',0.2);
  }
}

function updatePlay(){
  t++;
  player.bg += player.speed;
  player.bob += 0.2;

  player.vy += 0.44;
  player.y += player.vy;
  if(player.y >= G.GROUND){
    player.y = G.GROUND;
    player.vy = 0;
    player.onG = true;
  }

  // ★アイテムスポーン
  if(--itemSpawn <= 0){
    const isStrawberry = Math.random() < 0.15;
    const scoreValue = isStrawberry ? 20 : 10;
    const isHeal = Math.random() < 0.05;
    items.push({ x:G.W+20, y:G.GROUND-10-Math.random()*40, taken:false, heal:isHeal, score:scoreValue });
    itemSpawn = (30/player.speed * currentStage.obsRate)|0 + Math.random()*20;
  }
  
  // ★敵スポーン
  if(--obstacleSpawn <= 0){
      const r = Math.random();
      
      // Slime出現判定
      if(r < currentStage.slimeRate){
          obstacles.push({ x:G.W+20, y:G.GROUND-15, type:'Slime', hit:false }); 
      } 
      // Drone/Insect出現判定
      else if(r < currentStage.slimeRate + currentStage.droneRate){
          const type = (Math.random() < 0.7) ? 'Drone' : 'DiveDrone';
          const y = (type === 'Drone') ? G.GROUND-(Math.random()<0.6?20:50) : 0;
          obstacles.push({ x:G.W+20, y:y, type:type, hit:false, vy:0 });
      } 
      // Spike出現判定
      else if(r < currentStage.slimeRate + currentStage.droneRate + currentStage.spikeRate){
          obstacles.push({ x:G.W+20, y:G.GROUND+2, type:'Spike', hit:false });
      } 
      // Mine出現判定
      else if(r < currentStage.slimeRate + currentStage.droneRate + currentStage.spikeRate + 0.1) {
          obstacles.push({ x:G.W+20, y:G.GROUND-50, type:'Mine', hit:false, startY:G.GROUND-50, amplitude: 30, phase: Math.random()*6.28 });
      }
      
      obstacleSpawn = (60/player.speed * currentStage.obsRate)|0 + Math.random()*40;
  }

  if(t%600===0) player.speed = Math.min(player.speed+0.1, 4.0);

  // ボスロジックは無効

  // Move & Collide (省略)
  items.forEach(it => it.x -= player.speed);
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(!it.taken && Math.abs(it.x-player.x)<14 && Math.abs(it.y-player.y+10)<18){
      it.taken = true;
      score += it.score; 
      if(it.heal) { lives = Math.min(lives+1, MAX_LIVES); beep(1200,0.1,'sine',0.3); }
      else beep(880,0.08,'triangle',0.2);
    }
    if(it.x < -20 || it.taken) items.splice(i,1);
  }

  // Obstacles
  for(let i=obstacles.length-1;i>=0;i--){
    const d=obstacles[i];
    d.x -= player.speed*1.2;
    
    // ドローンの挙動を再適用
    if(d.type === 'Drone'){
      if(d.y<G.GROUND) d.y += Math.sin(t*0.1)*0.5;
    } else if(d.type === 'DiveDrone'){
      if(d.y < G.GROUND - 20) d.vy += 0.3;
      else d.vy = 0;
      d.y += d.vy;
    } else if(d.type === 'Mine'){
      d.y = d.startY + Math.sin(t*0.1 + d.phase) * d.amplitude;
    } else if(d.type === 'Slime'){
        d.y = G.GROUND - 15; 
    }
    
    if(!d.hit){
      let hit = false;
      let collisionRadius = 12; 
      let collisionOffsetY = 16; 
      
      // Slimeの当たり判定を調整
      if(d.type === 'Slime'){
          collisionRadius = 20; 
          collisionOffsetY = 24; 
      }
      // Drone/DiveDroneの当たり判定を調整
      else if(d.type === 'Drone' || d.type === 'DiveDrone'){
          collisionRadius = 14; 
          collisionOffsetY = 12; 
      }
      
      if(d.type === 'Spike'){
        if(player.onG && Math.abs(d.x-player.x)<14){ hit=true; }
      } else {
        if(Math.abs(d.x-player.x)<collisionRadius && Math.abs(d.y-player.y+collisionOffsetY)<collisionRadius){ hit=true; }
      }

      if(hit){
        d.hit = true;
        lives--;
        beep(100,0.2,'sawtooth',0.3);
      }
    }
    
    if(d.x < -20 || d.hit) obstacles.splice(i,1);
  }

  // Player Bullets (攻撃はボス戦でのみ機能するが残す)
  for(let i=bullets.length-1;i>=0;i--){
    bullets[i].x += 5;
    if(bullets[i].x > G.W) bullets.splice(i,1);
  }

  // ★ステージクリアチェック（1stステージのターゲットスコア達成時）
  if(score >= currentStage.target){
    // ステージを移動する代わりに、エンディングへ移行
    state = 'ENDING';
    endScrollY = G.H;
    playFanfare(); 
    return;
  }

  // Game Over (省略)
  if(lives <= 0){
    state = 'OVER';
    best = Math.max(best, score);
    document.getElementById('overTitle').textContent = 'GAME OVER';
    document.getElementById('scoreline').textContent = `SCORE: ${score} / BEST: ${best}`;
    overEl.style.display = 'flex';
  }

  // Update UI (省略)
  scEl.textContent = score;
  lfEl.textContent = lives;
}

function updateEnding(){
  endScrollY -= 0.6;

  // ★エンディング用クレジットのスコアを更新
  const scoreLineIndex = CREDITS.findIndex(line => line.startsWith("SCORE:"));
  if (scoreLineIndex !== -1) {
    CREDITS[scoreLineIndex] = `SCORE:   ${score}`;
  }

  if(endScrollY < - (CREDITS.length * 20 + 100)){
    state = 'OVER';
    best = Math.max(best, score);
    document.getElementById('overTitle').textContent = 'TRIAL EDITION CLEAR!';
    document.getElementById('scoreline').textContent = `FINAL SCORE: ${score}`;
    document.getElementById('retry').textContent = 'RETRY';
    overEl.style.display = 'flex';
  }
}

// ====================================
//  MAIN LOOP (省略)
// ====================================
function loop(){
  ctx.clearRect(0,0,G.W,G.H);
  
  if(state === 'PLAY' || state === 'ENDING'){
    drawSky();
    drawGround();
    items.forEach(drawBottle);
    
    obstacles.forEach(d=>{
        if(d.type === 'Drone' || d.type === 'DiveDrone') drawDroneAsInsect(d);
        else if(d.type === 'Slime') drawSlime(d);
        else if(d.type === 'Spike') drawSpike(d);
        else if(d.type === 'Mine') drawMine(d);
    });

    drawMoai();
    
    ctx.fillStyle='#e5f0ff';
    bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,3,0,6.28); ctx.fill(); });
    
    if(state === 'PLAY') updatePlay();
    if(state === 'ENDING') {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0,0,G.W,G.H);
      ctx.fillStyle = '#fff';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      CREDITS.forEach((line, i)=>{
        ctx.fillText(line, G.W/2, endScrollY + i*20);
      });
      updateEnding();
    }
  } else {
    drawSky();
    drawGround();
  }

  requestAnimationFrame(loop);
}

// ====================================
//  INPUTS (省略)
// ====================================
function jump(){
  if(state!=='PLAY') return;
  if(player.onG){
    player.vy = -8.5;
    player.onG = false;
    beep(700,0.05,'square',0.1);
  }
}
function drop(){
  if(state!=='PLAY') return;
  if(!player.onG) player.vy += 2.5;
}
function shoot(){
  if(state!=='PLAY') return;
  if(currentStage.boss && boss.active){ // 1stステージでは無効
    bullets.push({x:player.x+10, y:player.y-30});
    beep(900,0.04,'square',0.1);
  }
}

document.getElementById('go').onclick = startGame;
document.getElementById('retry').onclick = initGame;

const jBtn = document.getElementById('jump');
const dBtn = document.getElementById('drop');
const sBtn = document.getElementById('shot');

jBtn.addEventListener('touchstart',e=>{e.preventDefault();jump()}, {passive:false});
dBtn.addEventListener('touchstart',e=>{e.preventDefault();drop()}, {passive:false});
sBtn.addEventListener('touchstart',e=>{e.preventDefault();shoot()}, {passive:false});

addEventListener('keydown', e=>{
  if(e.code==='Enter' && (state==='START'||state==='OVER')) { 
    if(state==='OVER') initGame(); else startGame(); 
  }
  if(e.code==='Space' || e.code==='ArrowUp') jump();
  if(e.code==='ArrowDown') drop();
  if(e.code==='KeyF') shoot();
});

// START
initGame();
loop();

})();
</script>
